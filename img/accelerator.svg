<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="980" height="640" fill="#fbfbfa"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44403c"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <text x="34" y="42" font-size="21" font-weight="600" fill="#1c1917">student_gemm — int8 GEMM accelerator</text>
  <text x="34" y="65" font-size="13.5" fill="#57534e">128-wide MAC array, inverted weight-stationary. One tile of activations stays resident; the weight matrix streams past it.</text>

  <!-- control plane -->
  <rect x="34" y="92" width="912" height="72" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="50" y="115" font-size="12.5" font-weight="600" fill="#292524">TL-UL device port  ·  0x2001_0000</text>
  <text x="50" y="135" font-size="12" fill="#57534e">CPU writes addresses, strides, k_len · m_len · n_rows (and gather / requant setup), then ctrl; polls status.busy</text>
  <text x="50" y="153" font-size="12" fill="#78716c">control FSM:  IDLE → LOAD_A → MAC → MAC_TAIL → DRAIN → (MAC | FINISH)</text>

  <!-- host port -->
  <rect x="34" y="300" width="152" height="96" rx="7" fill="#fff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="110" y="331" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">TL-UL host</text>
  <text x="110" y="352" font-size="11.5" fill="#57534e" text-anchor="middle">Get / PutFullData</text>
  <text x="110" y="371" font-size="11.5" fill="#57534e" text-anchor="middle">to DDR3 or BRAM</text>
  <text x="110" y="389" font-size="11" fill="#a8a29e" text-anchor="middle">1 request in flight/cycle</text>

  <!-- reorder buffer -->
  <rect x="228" y="300" width="152" height="96" rx="7" fill="#fff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="304" y="329" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">Reorder buffer</text>
  <text x="304" y="348" font-size="11.5" fill="#57534e" text-anchor="middle">8 slots, keyed on</text>
  <text x="304" y="364" font-size="11.5" fill="#57534e" text-anchor="middle">a_source</text>
  <g fill="#e7e5e4" stroke="#a8a29e" stroke-width="0.8">
    <rect x="245" y="373" width="14" height="13" rx="2"/><rect x="262" y="373" width="14" height="13" rx="2"/>
    <rect x="279" y="373" width="14" height="13" rx="2"/><rect x="296" y="373" width="14" height="13" rx="2"/>
    <rect x="313" y="373" width="14" height="13" rx="2"/><rect x="330" y="373" width="14" height="13" rx="2"/>
    <rect x="347" y="373" width="14" height="13" rx="2"/><rect x="364" y="373" width="14" height="13" rx="2"/>
  </g>

  <!-- A tile -->
  <rect x="430" y="196" width="176" height="104" rx="7" fill="#fff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="518" y="223" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">A-tile RAMs</text>
  <text x="518" y="242" font-size="11.5" fill="#57534e" text-anchor="middle">128 × BRAM, one per row</text>
  <text x="518" y="258" font-size="11.5" fill="#57534e" text-anchor="middle">int16 activations</text>
  <g fill="#e7e5e4" stroke="#a8a29e" stroke-width="0.7">
    <rect x="448" y="268" width="8" height="20" rx="1.5"/><rect x="459" y="268" width="8" height="20" rx="1.5"/>
    <rect x="470" y="268" width="8" height="20" rx="1.5"/><rect x="481" y="268" width="8" height="20" rx="1.5"/>
    <rect x="492" y="268" width="8" height="20" rx="1.5"/><rect x="503" y="268" width="8" height="20" rx="1.5"/>
    <rect x="514" y="268" width="8" height="20" rx="1.5"/><rect x="525" y="268" width="8" height="20" rx="1.5"/>
    <rect x="536" y="268" width="8" height="20" rx="1.5"/><rect x="547" y="268" width="8" height="20" rx="1.5"/>
    <rect x="558" y="268" width="8" height="20" rx="1.5"/><rect x="569" y="268" width="8" height="20" rx="1.5"/>
    <rect x="580" y="268" width="8" height="20" rx="1.5"/>
  </g>
  <text x="596" y="284" font-size="11" fill="#a8a29e" text-anchor="middle">×128</text>
  <text x="518" y="186" font-size="11.5" font-style="italic" fill="#c2410c" text-anchor="middle">loaded once per tile — then stationary</text>

  <!-- weight stream -->
  <rect x="430" y="396" width="176" height="92" rx="7" fill="#fff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="518" y="423" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">Weight beat</text>
  <text x="518" y="442" font-size="11.5" fill="#57534e" text-anchor="middle">4 × int8 per 32-bit word</text>
  <g>
    <rect x="452" y="452" width="30" height="20" rx="2" fill="#fde8d7" stroke="#c2410c" stroke-width="0.9"/>
    <rect x="486" y="452" width="30" height="20" rx="2" fill="#fde8d7" stroke="#c2410c" stroke-width="0.9"/>
    <rect x="520" y="452" width="30" height="20" rx="2" fill="#fde8d7" stroke="#c2410c" stroke-width="0.9"/>
    <rect x="554" y="452" width="30" height="20" rx="2" fill="#fde8d7" stroke="#c2410c" stroke-width="0.9"/>
  </g>
  <text x="518" y="484" font-size="11" fill="#c2410c" text-anchor="middle">one weight broadcasts to all 128 lanes</text>

  <!-- MAC array -->
  <rect x="656" y="252" width="150" height="192" rx="7" fill="#fff" stroke="#57534e" stroke-width="1.6"/>
  <text x="731" y="279" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">MAC array</text>
  <text x="731" y="297" font-size="11.5" fill="#57534e" text-anchor="middle">128 × DSP48E1</text>
  <text x="731" y="313" font-size="11.5" fill="#57534e" text-anchor="middle">int8 × int16 → int32</text>
  <g>
    <rect x="672" y="325" width="118" height="16" rx="2" fill="#f5f5f4" stroke="#a8a29e" stroke-width="0.8"/>
    <rect x="672" y="345" width="118" height="16" rx="2" fill="#f5f5f4" stroke="#a8a29e" stroke-width="0.8"/>
    <rect x="672" y="365" width="118" height="16" rx="2" fill="#f5f5f4" stroke="#a8a29e" stroke-width="0.8"/>
    <rect x="672" y="385" width="118" height="16" rx="2" fill="#f5f5f4" stroke="#a8a29e" stroke-width="0.8"/>
  </g>
  <text x="731" y="337" font-size="10" fill="#57534e" text-anchor="middle">row 0</text>
  <text x="731" y="357" font-size="10" fill="#57534e" text-anchor="middle">row 1</text>
  <text x="731" y="377" font-size="10" fill="#57534e" text-anchor="middle">⋮</text>
  <text x="731" y="397" font-size="10" fill="#57534e" text-anchor="middle">row 127</text>
  <text x="731" y="424" font-size="11.5" fill="#57534e" text-anchor="middle">3-stage pipeline</text>

  <!-- accumulators -->
  <rect x="852" y="300" width="94" height="96" rx="7" fill="#fff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="899" y="329" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">Accum.</text>
  <text x="899" y="349" font-size="11.5" fill="#57534e" text-anchor="middle">128 × int32</text>
  <text x="899" y="372" font-size="11" fill="#57534e" text-anchor="middle">cleared per</text>
  <text x="899" y="386" font-size="11" fill="#57534e" text-anchor="middle">weight row</text>

  <!-- arrows -->
  <line x1="186" y1="348" x2="222" y2="348" stroke="#44403c" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M380,332 L404,332 L404,248 L424,248" fill="none" stroke="#44403c" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M380,364 L404,364 L404,442 L424,442" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ao)"/>
  <path d="M606,248 L630,248 L630,320 L650,320" fill="none" stroke="#44403c" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M606,442 L630,442 L630,376 L650,376" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#ao)"/>
  <line x1="806" y1="348" x2="846" y2="348" stroke="#44403c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- writeback -->
  <path d="M899,396 L899,556 L110,556 L110,400" fill="none" stroke="#44403c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="392" y="540" width="226" height="32" rx="5" fill="#fbfbfa" stroke="none"/>
  <text x="505" y="561" font-size="12" fill="#44403c" text-anchor="middle">C writeback — up to 128 contiguous int32 words (+ row max/min)</text>

  <!-- labels on streams -->
  <text x="404" y="212" font-size="11" fill="#44403c" text-anchor="end">A load</text>
  <text x="400" y="480" font-size="11" fill="#c2410c" text-anchor="end">W stream</text>

  <text x="34" y="600" font-size="11.5" fill="#78716c">All three streams — A load, W stream, C writeback — are sequential in memory, because the DDR3 last-level cache is direct-mapped.</text>
  <text x="34" y="620" font-size="11.5" fill="#78716c">Measured 12.4 MAC/cycle of a 16 MAC/cycle peak against a memory model that answers out of order.</text>
</svg>
