<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1250" width="1400" height="1250" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="1400" height="1250" fill="#fbfbfa"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44403c"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <text x="34" y="40" font-size="21" font-weight="600" fill="#1c1917">DDR3 access state machines — read and write paths</text>
  <text x="34" y="63" font-size="13" fill="#57534e">Every FSM a 32-bit load or store passes through, from student_gemm down to the wishbone beats. Blue = read path, orange = write path.</text>

  <!-- ============================ PANEL A ============================ -->
  <rect x="30" y="86" width="420" height="480" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="46" y="110" font-size="13.5" font-weight="600" fill="#1c1917">A · student_gemm — job FSM</text>
  <text x="46" y="128" font-size="11" fill="#78716c">which phase issues which kind of transaction</text>

  <rect x="150" y="146" width="150" height="34" rx="6" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="225" y="168" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">ST_IDLE</text>

  <rect x="150" y="212" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="225" y="234" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">ST_LOAD_A</text>
  <text x="312" y="228" font-size="10.5" fill="#1d4ed8">reads: A tile</text>
  <text x="312" y="242" font-size="10.5" fill="#78716c">n_rows x K/2 beats</text>

  <rect x="150" y="278" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="225" y="300" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">ST_MAC</text>
  <text x="312" y="294" font-size="10.5" fill="#1d4ed8">reads: W stream</text>
  <text x="312" y="308" font-size="10.5" fill="#78716c">M x K/4 beats</text>

  <rect x="150" y="344" width="150" height="34" rx="6" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="225" y="366" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">ST_MAC_TAIL</text>
  <text x="312" y="365" font-size="10.5" fill="#78716c">drain pipeline</text>

  <rect x="150" y="410" width="150" height="34" rx="6" fill="#fde8d7" stroke="#c2410c"/>
  <text x="225" y="432" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">ST_DRAIN</text>
  <text x="312" y="426" font-size="10.5" fill="#c2410c">writes: C</text>
  <text x="312" y="440" font-size="10.5" fill="#78716c">n_rows words</text>

  <rect x="150" y="496" width="150" height="34" rx="6" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="225" y="518" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">ST_FINISH</text>

  <line x1="225" y1="180" x2="225" y2="207" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="225" y1="246" x2="225" y2="273" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="225" y1="312" x2="225" y2="339" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="225" y1="378" x2="225" y2="405" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="225" y1="444" x2="225" y2="491" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="234" y="472" font-size="10" fill="#78716c">last m</text>
  <path d="M150,427 L110,427 L110,295 L145,295" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="52" y="362" font-size="10" fill="#78716c">next m</text>
  <text x="46" y="552" font-size="10.5" fill="#b91c1c">observed hang: ST_MAC, 2 beats into weight row 2,</text>
  <text x="46" y="565" font-size="10.5" fill="#b91c1c">right after the first ST_DRAIN write of the tile</text>

  <!-- ============================ PANEL B ============================ -->
  <rect x="470" y="86" width="900" height="480" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="486" y="110" font-size="13.5" font-weight="600" fill="#1c1917">B · rvlab_ddr_block_cache — per-access FSM (direct-mapped, write-back)</text>
  <text x="486" y="128" font-size="11" fill="#78716c">no explicit enum: the state is stall_q + the combinational hit / miss / dirty_rdata terms</text>

  <rect x="500" y="150" width="150" height="40" rx="6" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="575" y="167" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">READY</text>
  <text x="575" y="182" font-size="10" fill="#57534e" text-anchor="middle">a_ready = ~stall</text>

  <rect x="500" y="238" width="150" height="40" rx="6" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="575" y="255" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">COMPARE</text>
  <text x="575" y="270" font-size="10" fill="#57534e" text-anchor="middle">tag_rdata vs tag_q</text>

  <rect x="500" y="330" width="150" height="46" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="575" y="348" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">HIT — respond</text>
  <text x="575" y="363" font-size="9.5" fill="#166534" text-anchor="middle">Get: AccessAckData</text>
  <text x="575" y="373" font-size="9.5" fill="#166534" text-anchor="middle">Put: AccessAck, set dirty</text>

  <rect x="720" y="238" width="170" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="805" y="255" font-size="12" font-weight="600" fill="#7f1d1d" text-anchor="middle">MISS — stall</text>
  <text x="805" y="270" font-size="10" fill="#991b1b" text-anchor="middle">stall = stall_q | miss</text>

  <rect x="960" y="180" width="200" height="60" rx="6" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1060" y="199" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">EVICT (dirty only)</text>
  <text x="1060" y="214" font-size="9.5" fill="#9a3412" text-anchor="middle">be: PutFullData {old tag, idx}</text>
  <text x="1060" y="228" font-size="9.5" fill="#9a3412" text-anchor="middle">on a_ready: modify_clear → dirty=0</text>

  <rect x="960" y="292" width="200" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1060" y="311" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">FILL</text>
  <text x="1060" y="326" font-size="9.5" fill="#1e40af" text-anchor="middle">be: Get {new tag, idx}</text>
  <text x="1060" y="340" font-size="9.5" fill="#1e40af" text-anchor="middle">wait AccessAckData</text>

  <rect x="960" y="404" width="200" height="46" rx="6" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="1060" y="422" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">REFILL DONE</text>
  <text x="1060" y="437" font-size="9.5" fill="#57534e" text-anchor="middle">write data + tag, stall_q → 0</text>

  <line x1="575" y1="190" x2="575" y2="233" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="583" y="215" font-size="10" fill="#78716c">a_valid &amp; a_ready</text>
  <line x1="575" y1="278" x2="575" y2="325" stroke="#15803d" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="583" y="306" font-size="10" fill="#15803d">tag match</text>
  <line x1="650" y1="258" x2="715" y2="258" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="654" y="250" font-size="10" fill="#b91c1c">no match</text>
  <path d="M890,250 L925,250 L925,210 L955,210" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#aw)"/>
  <text x="880" y="196" font-size="10" fill="#c2410c">dirty=1</text>
  <path d="M890,266 L925,266 L925,322 L955,322" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="880" y="292" font-size="10" fill="#1d4ed8">dirty=0</text>
  <path d="M1060,240 L1060,287" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="1068" y="266" font-size="10" fill="#78716c">then fill</text>
  <line x1="1060" y1="352" x2="1060" y2="399" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <path d="M960,427 L700,427 L700,360 L655,360" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="760" y="420" font-size="10" fill="#15803d">re-compare → hit → respond</text>
  <path d="M500,350 L470,350 L470,140 L575,140 L575,145" fill="none" stroke="#44403c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ak)"/>

  <rect x="486" y="470" width="868" height="84" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="500" y="490" font-size="11.5" font-weight="600" fill="#713f12">Only ONE access is tracked at a time.</text>
  <text x="500" y="507" font-size="11" fill="#854d0e">a single ancillary_q holds the source ID; back-pressure is a_ready = ~stall. A dirty miss therefore costs two back-end</text>
  <text x="500" y="522" font-size="11" fill="#854d0e">transactions in sequence — write-back, then fill — and the requesting host is stalled across both.</text>
  <text x="500" y="542" font-size="11" fill="#854d0e">dirty_rdata is reloaded from dirty_mem[access_idx] using the LIVE bus index, while tag_rdata uses access_idx_q when stalled.</text>

  <!-- ============================ PANEL C ============================ -->
  <rect x="30" y="586" width="650" height="330" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="46" y="610" font-size="13.5" font-weight="600" fill="#1c1917">C · rvlab_ddr_prefetch — per-entry FSM (4 entries)</text>
  <text x="46" y="628" font-size="11" fill="#78716c">reads are cached in the table; writes pass through and invalidate matching entries</text>

  <rect x="70" y="656" width="130" height="38" rx="6" fill="#f5f5f4" stroke="#a8a29e"/>
  <text x="135" y="680" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">Invalid</text>

  <rect x="270" y="656" width="130" height="38" rx="6" fill="#fef3c7" stroke="#ca8a04"/>
  <text x="335" y="680" font-size="12" font-weight="600" fill="#713f12" text-anchor="middle">Pending</text>

  <rect x="470" y="656" width="130" height="38" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="535" y="680" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Valid</text>

  <rect x="270" y="760" width="130" height="38" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="335" y="784" font-size="12" font-weight="600" fill="#7f1d1d" text-anchor="middle">Stale</text>

  <line x1="200" y1="675" x2="265" y2="675" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="204" y="668" font-size="9.5" fill="#1d4ed8">Get allocates</text>
  <line x1="400" y1="675" x2="465" y2="675" stroke="#44403c" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="404" y="668" font-size="9.5" fill="#57534e">AccessAckData</text>
  <path d="M335,694 L335,755" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#aw)"/>
  <text x="343" y="728" font-size="9.5" fill="#c2410c">Put hits a pending addr</text>
  <path d="M270,779 L135,779 L135,699" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="150" y="795" font-size="9.5" fill="#57534e">response discarded → Invalid</text>
  <path d="M535,694 L535,820 L200,820 L145,820 L138,703" fill="none" stroke="#44403c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ak)"/>
  <text x="300" y="836" font-size="9.5" fill="#57534e">Put to a matching address, or a new miss, invalidates</text>

  <text x="46" y="868" font-size="11" fill="#57534e">The front-end response is combinational: d_anc comes from the request presented that cycle, so the unit holds</text>
  <text x="46" y="884" font-size="11" fill="#57534e">no per-transaction state of its own — it answers as it accepts.</text>
  <text x="46" y="903" font-size="11" fill="#b91c1c">Writes never allocate an entry; they only invalidate. A read that follows a write to the same block must re-fetch.</text>

  <!-- ============================ PANEL D ============================ -->
  <rect x="710" y="586" width="660" height="330" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="726" y="610" font-size="13.5" font-weight="600" fill="#1c1917">D · rvlab_ddr_blkmgr — wishbone beat FSM</text>
  <text x="726" y="628" font-size="11" fill="#78716c">one 256-bit block = two 128-bit wishbone beats, so every access takes two states</text>

  <rect x="930" y="660" width="150" height="40" rx="6" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="1005" y="684" font-size="12" font-weight="600" fill="#292524" text-anchor="middle">Primed</text>

  <rect x="740" y="770" width="170" height="46" rx="6" fill="#fde8d7" stroke="#c2410c"/>
  <text x="825" y="789" font-size="12" font-weight="600" fill="#7c2d12" text-anchor="middle">WriteHigh</text>
  <text x="825" y="804" font-size="9.5" fill="#9a3412" text-anchor="middle">upper 128 b of the block</text>

  <rect x="1120" y="770" width="170" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="1205" y="789" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">ReadHigh</text>
  <text x="1205" y="804" font-size="9.5" fill="#1e40af" text-anchor="middle">upper 128 b of the block</text>

  <path d="M950,700 L860,700 L860,765" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#aw)"/>
  <text x="770" y="726" font-size="9.5" fill="#c2410c">PutFullData: low beat</text>
  <path d="M1060,700 L1170,700 L1170,765" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="1120" y="726" font-size="9.5" fill="#1d4ed8">Get: low beat</text>
  <path d="M895,770 L990,742 L990,705" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <path d="M1135,770 L1035,742 L1030,705" fill="none" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="945" y="756" font-size="9.5" fill="#57534e">!wb_stall</text>

  <text x="726" y="852" font-size="11" fill="#57534e">PutPartialData (a 64-bit write) completes in Primed alone — one beat, no second state.</text>
  <text x="726" y="869" font-size="11" fill="#57534e">A 16-deep request buffer tracks outstanding wishbone transactions; entries run Invalid → PendingLow →</text>
  <text x="726" y="886" font-size="11" fill="#57534e">PendingHigh → Valid, and responses are returned strictly in order (the block protocol has no source field).</text>
  <text x="726" y="905" font-size="11" fill="#78716c">Below this sits the CDC FIFO, 50 MHz sys_clk ↔ 100 MHz ddr_ctrl, then the controller and PHY.</text>

  <!-- ============================ PANEL E ============================ -->
  <rect x="30" y="936" width="1340" height="290" rx="8" fill="#fff" stroke="#d6d3d1"/>
  <text x="46" y="960" font-size="13.5" font-weight="600" fill="#1c1917">E · The sequence that hangs on the board</text>

  <rect x="50" y="982" width="180" height="52" rx="6" fill="#fde8d7" stroke="#c2410c"/>
  <text x="140" y="1002" font-size="11" font-weight="600" fill="#7c2d12" text-anchor="middle">1 · ST_DRAIN writes C</text>
  <text x="140" y="1018" font-size="9.5" fill="#9a3412" text-anchor="middle">nt=1 → a single word</text>
  <text x="140" y="1029" font-size="9.5" fill="#166534" text-anchor="middle">completes (wr_out=0)</text>

  <rect x="272" y="982" width="180" height="52" rx="6" fill="#fde8d7" stroke="#c2410c"/>
  <text x="362" y="1002" font-size="11" font-weight="600" fill="#7c2d12" text-anchor="middle">2 · line now dirty</text>
  <text x="362" y="1018" font-size="9.5" fill="#9a3412" text-anchor="middle">cache set holds modified</text>
  <text x="362" y="1029" font-size="9.5" fill="#9a3412" text-anchor="middle">data, not yet written back</text>

  <rect x="494" y="982" width="180" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="584" y="1002" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">3 · ST_MAC reads W</text>
  <text x="584" y="1018" font-size="9.5" fill="#1e40af" text-anchor="middle">beat 149 of 56448</text>
  <text x="584" y="1029" font-size="9.5" fill="#1e40af" text-anchor="middle">row 2 of 384</text>

  <rect x="716" y="982" width="180" height="52" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="806" y="1002" font-size="11" font-weight="600" fill="#7f1d1d" text-anchor="middle">4 · miss on a dirty set</text>
  <text x="806" y="1018" font-size="9.5" fill="#991b1b" text-anchor="middle">evict then fill —</text>
  <text x="806" y="1029" font-size="9.5" fill="#991b1b" text-anchor="middle">two back-end transactions</text>

  <rect x="938" y="982" width="200" height="52" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="1038" y="1002" font-size="11" font-weight="600" fill="#7f1d1d" text-anchor="middle">5 · no response, ever</text>
  <text x="1038" y="1018" font-size="9.5" fill="#991b1b" text-anchor="middle">state=ST_MAC rb_cnt=1</text>
  <text x="1038" y="1029" font-size="9.5" fill="#991b1b" text-anchor="middle">rd_left=56299 frozen</text>

  <line x1="230" y1="1008" x2="267" y2="1008" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="452" y1="1008" x2="489" y2="1008" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="674" y1="1008" x2="711" y2="1008" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="896" y1="1008" x2="933" y2="1008" stroke="#44403c" stroke-width="1.5" marker-end="url(#ak)"/>

  <text x="50" y="1074" font-size="11.5" fill="#292524">The stalled transaction is a <tspan font-weight="600" fill="#1d4ed8">read</tspan> — ST_MAC issues only reads, and wr_out=0 means every write was acknowledged. The</text>
  <text x="50" y="1092" font-size="11.5" fill="#292524">preceding <tspan font-weight="600" fill="#c2410c">write</tspan> is what sets the trap: it dirties the line, so the next read to that set must take the evict-then-fill path.</text>
  <text x="50" y="1116" font-size="11.5" fill="#57534e">Deterministic across every run and unaffected by MAX_INFLIGHT, by tile shape, or by holding the request address stable.</text>
  <text x="50" y="1140" font-size="11.5" fill="#57534e">Exercised in simulation: panels A, B and C, with a behavioural stand-in below them — all pass bit-exact.</text>
  <text x="50" y="1158" font-size="11.5" fill="#b91c1c">Never exercised in simulation: panel D and everything under it — the request buffer, the CDC FIFO, the controller and the PHY.</text>
  <text x="50" y="1182" font-size="11" fill="#78716c">Read the panels top-to-bottom for one 32-bit access: A issues it, B may turn it into two block transactions, C may answer it</text>
  <text x="50" y="1198" font-size="11" fill="#78716c">from the prefetch table, and D splits whatever survives into two 128-bit wishbone beats.</text>
</svg>
